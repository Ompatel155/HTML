<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .parent{
        border:3px solid black;
        height: 700px;
        display: grid;
        grid-template-columns: 200px 200px 200px;
        grid-template-rows:200px 200px 200px;

    }
    .child{
        background-color: burlywood;
        border: 1px solid red;
    }
    #A{
        background-color: aqua;
        grid-row-start: 2;
        grid-column-start: 2;
        grid-column-start: 3;
    }
    #B{
        background-color: chartreuse;
        grid-row-start: 3;
        grid-column-start:2;
        grid-column-end:3;

    }
    #C{
        background-color: chocolate;
    }
    #D{
        background-color: blueviolet;
    }
    #E{
        background-color: darkkhaki;
    }
    #F{
        background-color: cornflowerblue;
    }
    #G{
        background-color: darkgray;
    }
    #H{
        background-color: darksalmon;
    }
</style>
<body>
    <div class="parent">
            
        <div class="child" id="A">1</div>
        <div class="child" id="B">2</div>
        <div class="child" id="C">3</div>
        <div class="child" id="D">4</div>
        <div class="child" id="E">5</div>
        <div class="child" id="F">6</div>
        <div class="child" id="G">7</div>
        <div class="child" id="H">8</div>
        <div class="child" id="I">9</div>
       

       
           
    </div>
</body>
</html>
