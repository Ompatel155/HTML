<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div{
        background-color: blueviolet;
        height: 200px;
        width: 300px;
        animation-name: any;
        animation-duration: 3S;
        animation-iteration-count: infinite;
    }
    div:hover{
        
    }
    @keyframes any {
        0%{
            background-color: brown;
            height: 400px;
            width: 400px;
            border-radius: 40px;
        }
         25%{
            background-color: chartreuse;
            height: 100vh;
            width: 50vw;
            /* border-radius: 40px; */
        }
         50%{
            background-color: rgb(148, 51, 113);
            height: 100vh;
            width: 100vw;
            border-radius: 40px;
        }
        100%{
            background-color: cyan;
            height: 200vh;
            width:200vw;
            border-radius: 25%;
        }
        
    }
</style>
<body>
  <h1>Animationss</h1>  
  <div></div>
</body>
</html>
