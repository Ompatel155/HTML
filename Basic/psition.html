<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 50px;
            width: 100px;
            border: 2px solid black;
            padding: 45px;
            margin: 5px;
            position: relative;
        }
        .box1{
            background-color: aqua;
            top:30px;
            left:50px
        }
        .box2{
            background-color: rgb(213, 203, 129);
        }
        .box3{
            background-color: rgb(82, 97, 52);
        }
        .box4{
            background-color: rgb(158, 70, 102);
        }
    </style>
</head>
<body>
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
</body>
</html>
